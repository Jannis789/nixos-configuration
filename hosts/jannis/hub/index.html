<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jannis-Host Dashboard</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 3rem auto; max-width: 34rem; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  ul { padding-left: 1.2rem; }
  li { margin: .4rem 0; }
  .dot { display: inline-block; width: .55em; height: .55em; border-radius: 50%; background: #999; margin-right: .35em; vertical-align: middle; }
  .dot.on { background: #2e9e4f; }
  .dot.off { background: #c0392b; }
  small { color: #666; }
</style>
</head>
<body>
<h1>WIP: Jannis-Host Dashboard</h1>
<ul>
  <li><a href="/cockpit/">Cockpit</a> — Reboot, Power-Off, Terminal</li>
  <li><a href="/pi-web/">pi-web</a> — Pi-Agent-Sessions im Browser</li>
  <li><span class="dot" id="bw-dot"></span><a id="bw-link">BetterWright</a> — Live-Browser des Agenten <small>(grün = Viewer läuft; Kachel klickbar = Link aktiv)</small></li>
</ul>
<script>
  // Status-Ball BetterWright: Viewer lauscht auf 127.0.0.1:8505 (token-gegate,
  // ohne Token antwortet er 404 — 502 heisst Prozess tot).
  fetch("/betterwright/").then(r => {
    document.getElementById("bw-dot").className = "dot " + ((r.status === 200 || r.status === 404) ? "on" : "off");
  }).catch(() => document.getElementById("bw-dot").className = "dot off");
  // Token holen (/bw-url, vom Viewer-Start beschrieben) -> Kachel klickbar machen.
  fetch("/bw-url").then(r => r.ok ? r.text() : null).then(t => {
    if (t && t.trim()) document.getElementById("bw-link").href = "/betterwright/?" + t.trim();
  }).catch(() => {});
</script>
</body>
</html>
